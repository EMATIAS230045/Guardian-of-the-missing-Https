<div class="rounded-xl w-full h-full shadow-[0_0px_30px_0px_rgba(61,166,147,0.4)] overflow-hidden">
    <div class="flex flex-col text-stone-900 px-8 py-6 h-full">
        <div class="flex justify-between items-center mb-6">
            <div class="text-xl font-semibold">Historial de Alertas</div>
            <div class="flex items-center gap-x-2">
                <div class="text-md font-semibold">Filtrar por:</div>
                <button [ngClass]="ordenReciente ? 'bg-[#1f594f]' : 'bg-[#2c8273]'" class="flex items-center text-white font-semibold rounded-full px-6 py-2 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:scale-[1.01] transition-all duration-200 cursor-pointer" (click)="toggleOrden()">{{ ordenReciente ? 'Más reciente primero' : 'Más antiguo primero' }}</button>
                <button [ngClass]="soloPendientes ? 'bg-[#2c8273]' : 'bg-[#1f594f]'" class="flex items-center text-white font-semibold rounded-full px-6 py-2 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:scale-[1.01] transition-all duration-200 cursor-pointer" (click)="togglePendientes()">Pendientes</button>
                <button [ngClass]="soloEmergencias ? 'bg-[#2c8273]' : 'bg-[#1f594f]'" class="flex items-center text-white font-semibold rounded-full px-6 py-2 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:scale-[1.01] transition-all duration-200 cursor-pointer" (click)="toggleEmergencias()">Emergencias</button>
                <button class="flex items-center justify-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white font-semibold rounded-full w-10 h-10 hover:bg-[#2c8273] hover:scale-[1.01] transition-all duration-200 cursor-pointer" (click)="limpiarFiltros()">✕</button>
            </div>
        </div>

        <div class="flex flex-col flex-1 rounded-xl h-full p-6 shadow-[inset_0_4px_10px_rgba(61,166,147,0.5)] gap-y-4 overflow-y-scroll">
            <div *ngIf="alertasFiltradas.length === 0" class="flex items-center justify-center flex-1 text-[#1f594f] font-semibold">No hay alertas que coincidan con los filtros seleccionados.</div>
            <div *ngFor="let alerta of alertasPaginadas" class="flex h-20 p-4 rounded-xl bg-[#e0fff9] text-[#1f594f] font-semibold shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)]">
                <div class="flex items-center justify-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white rounded-full min-w-35 px-6 py-2 mr-3" 
                    [ngClass]="alerta.type === 'Reporte' ? 'bg-[#1f594f]' : 'bg-red-800'">{{ alerta.type }}</div>
                <div class="flex items-center w-full"><div id="imageProfile" class="w-11 h-11 mr-4 rounded-full bg-stone-800"></div><p id="username">{{ alerta.username }}</p></div>
                <div class="flex items-center text-[#1f594f] font-semibold mr-8 min-w-55">Fecha de alerta: <div id="dateAlert" class="ml-4 font-bold">{{ alerta.date | date:'yyyy-MM-dd' }}</div></div>
                <div class="flex shadow-[inset_0_4px_10px_rgba(61,166,147,0.5)] bg-white rounded-full mr-3">
                    <div [class]="esAdmin ? 'flex items-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white rounded-full px-6 py-2 cursor-pointer hover:bg-[#2c8273] transition-all duration-200' : 'flex items-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white rounded-full px-6 py-2'" (click)="esAdmin && toggleEstadoAlerta(alerta)">Estado</div>
                    <div id="state" class="flex items-center px-6 font-semibold text-[#1f594f]">{{ alerta.state }}</div>
                </div>
                <button id="ubicationAlert" class="flex items-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white rounded-full px-6 py-2 hover:bg-[#2c8273] hover:scale-[1.025] transition-all duration-300 cursor-pointer">Ubicación</button>
            </div>
        </div>

        <!-- Controles de paginación -->
        <div class="flex justify-center items-center gap-x-2 mt-6">
            <button [disabled]="paginaActual === 1" class="flex items-center justify-center bg-[#1f594f] text-white font-semibold rounded-full w-9 h-9 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:bg-[#2c8273] hover:scale-[1.05] transition-all duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" (click)="paginaAnterior()">‹</button>
            <button *ngFor="let pagina of numerosDePagina" [ngClass]="pagina === paginaActual ? 'bg-[#2c8273]' : 'bg-[#1f594f]'" class="flex items-center justify-center text-white font-semibold rounded-full w-9 h-9 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:bg-[#2c8273] hover:scale-[1.05] transition-all duration-200 cursor-pointer" (click)="irAPagina(pagina)">{{ pagina }}</button>
            <button [disabled]="paginaActual === totalPaginas" class="flex items-center justify-center bg-[#1f594f] text-white font-semibold rounded-full w-9 h-9 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:bg-[#2c8273] hover:scale-[1.05] transition-all duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" (click)="paginaSiguiente()">›</button>
        </div>
    </div>
</div>
