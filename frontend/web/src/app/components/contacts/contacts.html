<div class="rounded-xl w-full h-full shadow-[0_0px_30px_0px_rgba(61,166,147,0.4)] overflow-hidden">
    <div class="flex flex-col text-stone-900 px-8 py-6 h-full">
        <div class="flex justify-between items-center mb-6">
            <div class="mb-4 text-xl font-semibold">Contactos</div>
            <div class="flex items-center">
                <p class="font-semibold mr-4 text-md">Buscar: </p>
                <input [(ngModel)]="terminoBusqueda" (ngModelChange)="paginaActual = 1" class="w-60 h-12 pl-4 rounded-full font-semibold shadow-[inset_0_4px_10px_rgba(61,166,147,0.5)] text-stone-800 bg-[#f5fffd] focus:ring-2 focus:ring-[#1f594f] outline-none">
            </div>
        </div>

        <div class="flex flex-col flex-1 rounded-xl p-6 shadow-[inset_0_4px_10px_rgba(61,166,147,0.5)] gap-y-4 overflow-hidden overflow-y-auto">
            <div *ngIf="contactosFiltrados.length === 0" class="flex items-center justify-center flex-1 text-[#1f594f] font-semibold">{{ contactos.length === 0 ? 'Aún no tienes contactos agregados.' : 'No se encontraron contactos con ese criterio.' }}</div>
            <div *ngFor="let contacto of contactosPaginados" class="flex h-20 p-4 rounded-xl bg-[#e0fff9] text-[#1f594f] font-semibold shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)]">
                <div class="flex items-center w-full"><div id="imageProfile" class="w-11 h-11 mr-4 rounded-full bg-[#1f594f]"></div><p id="username">{{contacto.username}}</p></div>
                <div class="flex items-center text-[#1f594f] font-semibold mr-26 min-w-55">Correo: <div id="dateAlert" class="ml-4 font-bold">{{contacto.email}}</div></div>
                <div class="flex shadow-[inset_0_4px_10px_rgba(61,166,147,0.5)] bg-white rounded-full mr-3">
                    <div class="flex items-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white rounded-full px-6 py-2">Estado</div>
                    <div id="state" class="flex items-center w-27 px-6 font-semibold text-[#1f594f]">{{contacto.state}}</div>
                </div>
                <button id="ubicationAlert" class="flex items-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white rounded-full px-6 py-2 hover:bg-[#2c8273] hover:scale-[1.025] transition-all duration-300 cursor-pointer whitespace-nowrap">Ultima ubicación</button>
            </div>
        </div>

        <!-- Controles de paginación -->
        <div class="flex justify-center items-center gap-x-2 mt-6">
            <button [disabled]="paginaActual === 1" class="flex items-center justify-center bg-[#1f594f] text-white font-semibold rounded-full w-9 h-9 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:bg-[#2c8273] hover:scale-[1.05] transition-all duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" (click)="paginaAnterior()">‹</button>
            <button *ngFor="let pagina of numerosDePagina" [ngClass]="pagina === paginaActual ? 'bg-[#2c8273]' : 'bg-[#1f594f]'" class="flex items-center justify-center text-white font-semibold rounded-full w-9 h-9 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:bg-[#2c8273] hover:scale-[1.05] transition-all duration-200 cursor-pointer" (click)="irAPagina(pagina)">{{ pagina }}</button>
            <button [disabled]="paginaActual === totalPaginas" class="flex items-center justify-center bg-[#1f594f] text-white font-semibold rounded-full w-9 h-9 shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] hover:bg-[#2c8273] hover:scale-[1.05] transition-all duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100" (click)="paginaSiguiente()">›</button>
        </div>
    </div>
</div>
