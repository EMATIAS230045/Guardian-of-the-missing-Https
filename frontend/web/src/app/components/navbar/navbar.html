<div class="rounded-xl w-full h-20 mb-5 shadow-[0_0px_30px_0px_rgba(61,166,147,0.4)]">
    <div class="flex h-full items-center text-stone-900 px-8">
        <p class="font-semibold text-xl whitespace-nowrap">Guardian Of The Missing</p>
        <div class="flex w-full justify-end items-center">
            <button class="flex justify-center items-center w-11 h-11 mr-6 rounded-full shadow-[0_0px_20px_0px_rgba(44,120,106,0.4)] hover:scale-[1.05] transition-all duration-300 cursor-pointer">
                <div class="w-6 h-6 bg-[url('/night-mode.png')] bg-contain bg-center bg-no-repeat"></div></button>
            <button class="flex justify-center items-center w-11 h-11 rounded-full shadow-[0_0px_20px_0px_rgba(44,120,106,0.4)] hover:scale-[1.05] transition-all duration-300 cursor-pointer">
                <div class="w-6 h-6 bg-[url('/notification-bell.png')] bg-contain bg-center bg-no-repeat"></div></button>
            <button class="flex py-2 px-6 cursor-pointer" (click)="openProfileUser()">
                <div class="w-11 h-11 bg-stone-800 rounded-full"></div>
                <div class="flex flex-col ml-4 items-start justify-center">
                    <p id="username" class="text-[16px] font-semibold">{{ usuarioActual?.username }}</p>
                    <p class="text-[14px]" [class.hidden]="usuarioActual?.role !== 'admin'">Administrador</p>
                </div>
            </button>
        </div>
    </div>
</div>
