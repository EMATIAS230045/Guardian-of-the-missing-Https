<div class="fixed inset-0 flex items-center justify-center bg-black/25">
    <div class="bg-white rounded-xl p-4 shadow-2xl w-4xl">
        <h2 class="text-xl font-semibold mb-4">Ubicación del reporte #{{ alerta?.id_alerta ?? 'seleccionado' }}</h2>
        <div id="map" class="w-full h-200 rounded-xl [&_.alerta-marker]:!bg-transparent [&_.alerta-marker]:!border-0 [&_.alerta-marker_span]:block [&_.alerta-marker_span]:w-[22px] [&_.alerta-marker_span]:h-[22px] [&_.alerta-marker_span]:rounded-full [&_.alerta-marker_span]:bg-red-600 [&_.alerta-marker_span]:border-4 [&_.alerta-marker_span]:border-red-900"></div>
        <div class="flex justify-end mt-4">
            <button class="bg-[#1f594f] text-white px-6 py-2 rounded-full cursor-pointer font-semibold" (click)="cerrar()">Cerrar</button>
        </div>
    </div>
</div>
