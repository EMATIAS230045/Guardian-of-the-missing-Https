<div class="rounded-xl w-full h-full shadow-[0_0px_30px_0px_rgba(61,166,147,0.4)]">
    <div class="text-stone-900 px-8 py-6">
        <div class="flex justify-between mb-4">
            <h1 class="text-xl font-semibold">Geocercas</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm font-semibold text-[#1f594f]">Reportes: {{ alertas.length }}</span>
                <button [disabled]="cargando || errorCarga || alertas.length === 0" class="flex items-center bg-[#1f594f] shadow-[0_0px_30px_0px_rgba(44,120,106,0.4)] text-white font-semibold rounded-full px-6 py-2 hover:bg-[#2c8273] hover:scale-[1.025] transition-all duration-300 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed" (click)="toggleMapaCalor()">{{ mostrandoMapaCalor ? 'Ver mapa normal' : 'Ver mapa de calor' }}</button>
            </div>
        </div>
        <div *ngIf="cargando" class="mb-4 text-sm font-semibold text-[#1f594f]">Cargando reportes...</div>
        <div *ngIf="!cargando && errorCarga" class="mb-4 text-sm font-semibold text-red-600">No se pudieron cargar los reportes.</div>
        <div *ngIf="!cargando && !errorCarga && alertas.length === 0" class="mb-4 text-sm font-semibold text-[#1f594f]">No hay reportes con geolocalización.</div>
        <div #mapContainer class="w-full h-200 rounded-xl [&_.reporte-marker]:!bg-transparent [&_.reporte-marker]:!border-0 [&_.reporte-marker_span]:block [&_.reporte-marker_span]:w-[22px] [&_.reporte-marker_span]:h-[22px] [&_.reporte-marker_span]:rounded-full [&_.reporte-marker_span]:bg-red-600 [&_.reporte-marker_span]:border-4 [&_.reporte-marker_span]:border-red-900 [&_.reporte-marker_span]:shadow-[0_0_0_5px_rgba(239,68,68,0.3)]"></div>
    </div>
</div>
